<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>شطرنج زنده</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="chess.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div id="screen-loading" class="screen active">
    <div class="brand-mark">
      <svg viewBox="0 0 100 100" width="72" height="72" class="brand-svg">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0cf8c"/>
            <stop offset="100%" stop-color="#b9823f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
        <!-- shield arc behind the king -->
        <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round"/>
        <!-- circuit lines: left -->
        <g fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round">
          <path d="M8,45 L20,45 L27,52"/>
          <path d="M6,56 L18,56 L25,63"/>
          <path d="M9,67 L21,67 L28,74"/>
        </g>
        <g fill="#8a0f0f" stroke="url(#goldGrad)" stroke-width="2.4">
          <circle cx="8" cy="45" r="3"/>
          <circle cx="6" cy="56" r="3"/>
          <circle cx="9" cy="67" r="3"/>
        </g>
        <!-- circuit lines: right (mirrored) -->
        <g fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round">
          <path d="M92,45 L80,45 L73,52"/>
          <path d="M94,56 L82,56 L75,63"/>
          <path d="M91,67 L79,67 L72,74"/>
        </g>
        <g fill="#8a0f0f" stroke="url(#goldGrad)" stroke-width="2.4">
          <circle cx="92" cy="45" r="3"/>
          <circle cx="94" cy="56" r="3"/>
          <circle cx="91" cy="67" r="3"/>
        </g>
        <!-- king piece -->
        <g fill="url(#goldGrad)">
          <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
          <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
          <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
          <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
          <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
          <rect x="34" y="73" width="32" height="7" rx="2"/>
          <rect x="31" y="80" width="38" height="6" rx="2"/>
        </g>
      </svg>
    </div>
    <div class="loading-text">در حال اتصال به بازی...</div>
    <div class="spinner"></div>
  </div>

  <div id="screen-error" class="screen">
    <div class="error-icon">!</div>
    <div id="error-text" class="error-text">مشکلی پیش آمد</div>
  </div>

  <div id="screen-game" class="screen">

    <div class="topbar">
      <div class="topbar-status" id="conn-status"><span class="dot"></span><span id="conn-text">متصل</span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" aria-label="تم صفحه">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.1 5.1 0 0 0 22 10.5C22 5.8 17.5 2 12 2zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-5A1.5 1.5 0 1 1 9.5 4a1.5 1.5 0 0 1 0 3zm5 0A1.5 1.5 0 1 1 14.5 4a1.5 1.5 0 0 1 0 3zm3 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
        </button>
        <button class="icon-btn" id="btn-chat" aria-label="چت">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <span class="chat-badge hidden" id="chat-badge"></span>
        </button>
        <button class="icon-btn" id="btn-history" aria-label="تاریخچه حرکات">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5v4l5-4.5L13 0v3z"/></svg>
        </button>
      </div>
    </div>

    <div class="player-card" id="player-top">
      <div class="avatar" id="avatar-top"></div>
      <div class="player-info">
        <div class="player-name" id="name-top">حریف</div>
        <div class="captured-row" id="captured-top"></div>
      </div>
      <div class="clock" id="clock-top">05:00</div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="promo-modal" class="promo-modal hidden">
        <div class="promo-card">
          <div class="promo-title">انتخاب مهره ترفیع</div>
          <div class="promo-options" id="promo-options"></div>
        </div>
      </div>
    </div>

    <div class="player-card" id="player-bottom">
      <div class="avatar" id="avatar-bottom"></div>
      <div class="player-info">
        <div class="player-name" id="name-bottom">شما</div>
        <div class="captured-row" id="captured-bottom"></div>
      </div>
      <div class="clock" id="clock-bottom">05:00</div>
    </div>

    <div class="turn-banner" id="turn-banner">نوبت شما</div>
    <div class="spectators-banner hidden" id="spectators-banner">
      <span class="spectators-icon">👁</span><span id="spectators-text"></span>
    </div>

    <div class="action-row" id="action-row">
      <button class="action-btn danger" id="btn-resign">تسلیم</button>
      <button class="action-btn" id="btn-draw">پیشنهاد تساوی</button>
    </div>
    <div class="spectator-note hidden" id="spectator-note">👁 در حال تماشای این بازی هستید</div>

  </div>

  <div id="history-panel" class="history-panel hidden">
    <div class="history-head">
      <span>تاریخچه حرکات</span>
      <button class="icon-btn icon-btn-close" id="btn-close-history">بستن ✕</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>

  <div id="theme-panel" class="history-panel hidden">
    <div class="history-head">
      <span>تم صفحه</span>
      <button class="icon-btn icon-btn-close" id="btn-close-theme">بستن ✕</button>
    </div>
    <div class="theme-list" id="theme-list">
      <button class="theme-opt" data-theme="dark">
        <span class="theme-swatch theme-swatch-dark"></span>تیره
      </button>
      <button class="theme-opt" data-theme="light">
        <span class="theme-swatch theme-swatch-light"></span>روشن
      </button>
      <button class="theme-opt" data-theme="wood">
        <span class="theme-swatch theme-swatch-wood"></span>چوبی
      </button>
      <button class="theme-opt" data-theme="green">
        <span class="theme-swatch theme-swatch-green"></span>سبز کلاسیک
      </button>
    </div>
    <div class="history-head" style="margin-top:8px;">
      <span>صدا</span>
    </div>
    <div class="theme-list" id="sound-toggle-list">
      <button class="theme-opt" id="btn-sound-on">🔊 روشن</button>
      <button class="theme-opt" id="btn-sound-off">🔇 خاموش</button>
    </div>
  </div>

  <div id="chat-panel" class="history-panel hidden">
    <div class="history-head">
      <span>گفتگو</span>
      <button class="icon-btn icon-btn-close" id="btn-close-chat">بستن ✕</button>
    </div>
    <div id="chat-list" class="chat-list"><div class="chat-empty">هنوز پیامی رد و بدل نشده</div></div>
    <div class="chat-input-row">
      <input id="chat-input" class="chat-input" type="text" maxlength="300" placeholder="پیام..." autocomplete="off">
      <button class="icon-btn chat-send" id="btn-chat-send" aria-label="ارسال">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div id="modal-icon" class="modal-icon">♔</div>
      <div id="modal-title" class="modal-title">پایان بازی</div>
      <div id="modal-sub" class="modal-sub"></div>
      <div id="modal-elo" class="modal-elo"></div>
      <button class="action-btn primary" id="modal-close">بستن</button>
    </div>
  </div>

  <div id="draw-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">🤝</div>
      <div class="modal-title">پیشنهاد تساوی</div>
      <div class="modal-sub">حریف پیشنهاد تساوی داد. آیا قبول می‌کنید؟</div>
      <div class="action-row">
        <button class="action-btn danger" id="btn-draw-decline">رد</button>
        <button class="action-btn primary" id="btn-draw-accept">قبول</button>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>

</div>

<script src="app.js"></script>
</body>
        </html>
