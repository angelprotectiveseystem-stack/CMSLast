<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>پنل مدیر مدرسه — مسابقات شطرنج</title>
<link rel="stylesheet" href="/principal-assets/style.css?v={{V}}">
</head>
<body>

<!-- ── اسپلش خوش‌آمدگویی ──────────────────────────────────── -->
<div id="splash" class="splash">
  <div class="splash-glow"></div>
  <div class="splash-sparkles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="splash-content">
    <div class="splash-crown">
      <svg viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
        <defs>
          <linearGradient id="goldGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d9a3"/>
            <stop offset="100%" stop-color="#b9823f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
        <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradSplash)" stroke-width="4.2" stroke-linecap="round"/>
        <g fill="url(#goldGradSplash)">
          <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
          <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
          <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
          <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
          <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
          <rect x="34" y="73" width="32" height="7" rx="2"/>
          <rect x="31" y="80" width="38" height="6" rx="2"/>
        </g>
      </svg>
    </div>
    <h1 class="splash-title">پنل مدیر مدرسه</h1>
    <p class="splash-sub">خوش آمدید</p>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="app" class="app-veil">

  <!-- ── ساید‌بار (فقط دسکتاپ) ─────────────────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="goldGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f0cf8c"/>
              <stop offset="100%" stop-color="#b9823f"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
          <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradNav)" stroke-width="4.2" stroke-linecap="round"/>
          <g fill="url(#goldGradNav)">
            <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
            <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
            <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
            <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
            <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
            <rect x="34" y="73" width="32" height="7" rx="2"/>
            <rect x="31" y="80" width="38" height="6" rx="2"/>
          </g>
        </svg>
      </span>
      <span class="brand-text">پنل مدیر مدرسه</span>
    </div>

    <nav id="side-nav">
      <button class="nav-item active" data-view="home"><span class="nav-ic">🏠</span><span>خانه</span></button>
      <button class="nav-item" data-view="classes"><span class="nav-ic">🏫</span><span>کلاس‌ها</span></button>
      <button class="nav-item" data-view="players"><span class="nav-ic">♟️</span><span>بازیکن‌ها</span></button>
      <button class="nav-item" data-view="matches"><span class="nav-ic">📅</span><span>مسابقات</span></button>
      <button class="nav-item" data-view="top"><span class="nav-ic">🏆</span><span>نفرات برتر</span></button>
      <button class="nav-item" data-view="trends"><span class="nav-ic">📈</span><span>روندها</span></button>
    </nav>

    <div class="sidebar-foot">
      <span class="live-dot"></span>
      <span>نمای فقط‌خواندنی</span>
    </div>
  </aside>

  <!-- ── محتوای اصلی ───────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <h2 id="view-title">خانه</h2>
      <div id="topbar-clock" class="topbar-clock">--:--:--</div>
    </header>

    <div id="view-body" class="view-body">
      <div class="loading-state"><span class="spinner"></span>در حال بارگذاری…</div>
    </div>
  </main>

  <!-- ── ناوبری پایین صفحه (فقط موبایل) ───────────────────── -->
  <!-- FIX: قبلاً این ناوبری بچه‌ی #app بود. تا وقتی #app کلاسِ app-veil/reveal
       داره (یعنی از لحظه‌ی لود صفحه تا چند صدم‌ثانیه بعد از تمومِ اسپلش)،
       #app یک transform فعال دارد؛ طبق مشخصاتِ CSS، هر المانِ ترنسفورم‌شده
       برای بچه‌های position:fixed خودش «containing block» جدید می‌سازه.
       یعنی این ناوبری، به‌جای اینکه صرفاً به پایینِ کل صفحه فیکس باشه، عملاً
       به #app فیکس می‌شد و همراه با ترنسفورمِ #app (که از scale(0.99) به
       scale(1) و translateY(14px) به ۰ انیمیت می‌شه) خودش هم کش میومد و
       جا‌به‌جا می‌شد — دقیقاً همون «سکته‌زدن/کشیده‌شدن» یک‌ثانیه‌ای درست
       بعد از تمومِ خوش‌آمدگویی. با انتقالِ این ناوبری به بیرونِ #app (به‌عنوان
       فرزندِ مستقیمِ body)، دیگه هیچ‌وقت زیرِ ترنسفورمِ #app قرار نمی‌گیره و
       همیشه واقعاً نسبت به کل صفحه فیکسه. -->

</div>

<nav id="bottom-nav" class="bottom-nav">
  <button class="bn-item active" data-view="home">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.2 12 4l9 7.2"/><path d="M5.2 9.8V19a1 1 0 0 0 1 1H9.6v-5.6h4.8V20H17.8a1 1 0 0 0 1-1V9.8"/></svg></span>
    <span class="bn-label">خانه</span>
  </button>
  <button class="bn-item" data-view="classes">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V9.2L12 5l8 4.2v10.3"/><path d="M9.2 19.5v-5.6h5.6v5.6"/><path d="M4 19.5h16"/></svg></span>
    <span class="bn-label">کلاس‌ها</span>
  </button>
  <button class="bn-item" data-view="players">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.3" cy="7.8" r="2.6"/><path d="M4.4 19c0-2.7 2.2-4.6 4.9-4.6s4.9 1.9 4.9 4.6"/><circle cx="17" cy="8.6" r="2"/><path d="M15.2 19c.2-2 1.5-3.5 3.3-3.9"/></svg></span>
    <span class="bn-label">بازیکن‌ها</span>
  </button>
  <button class="bn-item" data-view="matches">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2.2"/><path d="M4 10h16M8 3.5v3M16 3.5v3"/></svg></span>
    <span class="bn-label">مسابقات</span>
  </button>
  <button class="bn-item" data-view="top">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v3.6a4.5 4.5 0 0 1-9 0V4Z"/><path d="M7.5 5.2H5a2 2 0 0 0 0 4h2.3M16.5 5.2H19a2 2 0 0 1 0 4h-2.3"/><path d="M12 12.6v2.6M9.3 20h5.4M10.3 15.2h3.4v3h-3.4z"/></svg></span>
    <span class="bn-label">برترین‌ها</span>
  </button>
  <button class="bn-item" data-view="trends">
    <span class="bn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5 9 11.5l4 4 7-8"/><path d="M15.2 6.5H20v4.8"/></svg></span>
    <span class="bn-label">روندها</span>
  </button>
</nav>

<script>window.PRINCIPAL_KEY = "{{KEY}}";</script>
<script src="/principal-assets/app.js?v={{V}}"></script>
</body>
</html>
