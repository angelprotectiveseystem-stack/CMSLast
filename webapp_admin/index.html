<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>پنل مدیریت — مسابقات شطرنج</title>
<link rel="stylesheet" href="/panel/style.css?v={{V}}">
</head>
<body>

<!-- ── صفحه ورود ───────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 100 100" width="64" height="64" class="brand-svg" aria-hidden="true">
        <defs>
          <linearGradient id="goldGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0cf8c"/>
            <stop offset="100%" stop-color="#b9823f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
        <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradLogin)" stroke-width="4.2" stroke-linecap="round"/>
        <g fill="none" stroke="url(#goldGradLogin)" stroke-width="2.6" stroke-linecap="round">
          <path d="M8,45 L20,45 L27,52"/>
          <path d="M6,56 L18,56 L25,63"/>
          <path d="M9,67 L21,67 L28,74"/>
        </g>
        <g fill="#8a0f0f" stroke="url(#goldGradLogin)" stroke-width="2.4">
          <circle cx="8" cy="45" r="3"/>
          <circle cx="6" cy="56" r="3"/>
          <circle cx="9" cy="67" r="3"/>
        </g>
        <g fill="none" stroke="url(#goldGradLogin)" stroke-width="2.6" stroke-linecap="round">
          <path d="M92,45 L80,45 L73,52"/>
          <path d="M94,56 L82,56 L75,63"/>
          <path d="M91,67 L79,67 L72,74"/>
        </g>
        <g fill="#8a0f0f" stroke="url(#goldGradLogin)" stroke-width="2.4">
          <circle cx="92" cy="45" r="3"/>
          <circle cx="94" cy="56" r="3"/>
          <circle cx="91" cy="67" r="3"/>
        </g>
        <g fill="url(#goldGradLogin)">
          <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
          <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
          <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
          <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
          <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
          <rect x="34" y="73" width="32" height="7" rx="2"/>
          <rect x="31" y="80" width="38" height="6" rx="2"/>
        </g>
      </svg>
    </div>
    <h1>پنل مدیریت مسابقات شطرنج</h1>
    <p class="login-sub">برای ورود، رمز عبور پنل را وارد کنید.</p>
    <input type="password" id="login-password" placeholder="رمز عبور" autocomplete="current-password">
    <button id="login-btn">ورود به پنل</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- ── برنامه اصلی ─────────────────────────────────────────── -->
<div id="app" class="hidden">

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100" width="30" height="30" class="brand-svg" aria-hidden="true">
          <defs>
            <linearGradient id="goldGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f0cf8c"/>
              <stop offset="100%" stop-color="#b9823f"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
          <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradNav)" stroke-width="4.2" stroke-linecap="round"/>
          <g fill="url(#goldGradNav)">
            <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
            <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
            <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
            <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
            <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
            <rect x="34" y="73" width="32" height="7" rx="2"/>
            <rect x="31" y="80" width="38" height="6" rx="2"/>
          </g>
        </svg>
      </span>
      <span class="brand-text">پنل مسابقات</span>
    </div>

    <nav id="nav">
      <span class="nav-group-label">کلی</span>
      <button class="nav-item active" data-view="home"><span class="nav-coord">e1</span><span class="nav-ic">🏠</span><span class="nav-label">خانه</span></button>

      <span class="nav-group-label">مسابقات</span>
      <button class="nav-item" data-view="matches"><span class="nav-coord">a2</span><span class="nav-ic">♟️</span><span class="nav-label">مسابقات شطرنج</span></button>
      <button class="nav-item" data-view="live"><span class="nav-coord">d4</span><span class="nav-ic">🔴</span><span class="nav-label">شطرنج زنده</span></button>
      <button class="nav-item" data-view="players"><span class="nav-coord">b1</span><span class="nav-ic">🧑‍🤝‍🧑</span><span class="nav-label">مسابقه‌دهنده‌ها</span></button>
      <button class="nav-item" data-view="elo"><span class="nav-coord">h8</span><span class="nav-ic">📊</span><span class="nav-label">سطح پیشرفت / ELO</span></button>

      <span class="nav-group-label">مدیریت</span>
      <button class="nav-item" data-view="admins"><span class="nav-coord">c1</span><span class="nav-ic">🛡️</span><span class="nav-label">مدیر‌ها</span></button>
      <button class="nav-item" data-view="online"><span class="nav-coord">g1</span><span class="nav-ic">🟢</span><span class="nav-label">آنلاین‌ها</span></button>
      <button class="nav-item" data-view="messages"><span class="nav-coord">f1</span><span class="nav-ic">✉️</span><span class="nav-label">پیام‌های ارسالی</span></button>
      <button class="nav-item" data-view="activity"><span class="nav-coord">a8</span><span class="nav-ic">🧾</span><span class="nav-label">فعالیت‌ها</span></button>

      <span class="nav-group-label">سیستم</span>
      <button class="nav-item" data-view="charts"><span class="nav-coord">d1</span><span class="nav-ic">📈</span><span class="nav-label">نمودارها</span></button>
      <button class="nav-item" data-view="assistant"><span class="nav-coord">h1</span><span class="nav-ic">🤖</span><span class="nav-label">دستیار</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-coord">a1</span><span class="nav-ic">⚙️</span><span class="nav-label">تنظیمات</span></button>
    </nav>

    <div class="sidebar-foot">
      <span class="live-dot"></span>
      <span id="conn-status">در حال اتصال…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">خانه</h2>
      <div id="topbar-clock" class="topbar-clock">--:--:--</div>
    </header>

    <div id="view-body" class="view-body">
      <div class="loading-state"><span class="spinner"></span>در حال بارگذاری…</div>
    </div>
  </main>

  <!-- ── ناوبری پایین صفحه (فقط موبایل) ───────────────────── -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="bn-item active" data-view="home"><span class="bn-ic">🏠</span><span class="bn-label">خانه</span></button>
    <button class="bn-item" data-view="matches"><span class="bn-ic">♟️</span><span class="bn-label">مسابقات</span></button>
    <button class="bn-item" data-view="players"><span class="bn-ic">🧑‍🤝‍🧑</span><span class="bn-label">بازیکن‌ها</span></button>
    <button class="bn-item" data-view="charts"><span class="bn-ic">📈</span><span class="bn-label">نمودارها</span></button>
    <button class="bn-item bn-more" data-action="more"><span class="bn-ic">☰</span><span class="bn-label">بیشتر</span></button>
  </nav>

</div>

<!-- ── نشانگر موس سفارشی (فقط برای دسکتاپ با موس واقعی؛ با app.js فعال می‌شود) ── -->
<div id="cursor-dot" class="cursor-dot" aria-hidden="true"></div>
<div id="cursor-ring" class="cursor-ring" aria-hidden="true"></div>

<script src="/panel/app.js?v={{V}}"></script>
</body>
</html>
