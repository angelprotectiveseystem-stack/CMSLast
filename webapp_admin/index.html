<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>پنل مدیر مدرسه — مسابقات شطرنج</title>
<link rel="stylesheet" href="/principal-assets/style.css?v={{V}}">
</head>
<body>

<!-- ── صفحه خوش‌آمدگویی اولیه ─────────────────────────────── -->
<div id="welcome-screen" class="welcome-screen">
  <div class="wl-rings" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="wl-sparkles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="welcome-inner">
    <span class="welcome-mark">
      <svg viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
        <defs>
          <linearGradient id="goldGradWelcome" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0cf8c"/>
            <stop offset="100%" stop-color="#b9823f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
        <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradWelcome)" stroke-width="4.2" stroke-linecap="round"/>
        <g fill="url(#goldGradWelcome)">
          <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
          <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
          <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
          <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
          <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
          <rect x="34" y="73" width="32" height="7" rx="2"/>
          <rect x="31" y="80" width="38" height="6" rx="2"/>
        </g>
      </svg>
    </span>
    <div class="welcome-word" id="welcome-word"></div>
    <div class="welcome-line"></div>
    <div class="welcome-sub">پنل مدیریت مدرسه — مسابقات شطرنج</div>
    <div class="welcome-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="app" class="app-veil">

  <!-- ── ساید‌بار (فقط دسکتاپ) ─────────────────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="goldGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f0cf8c"/>
              <stop offset="100%" stop-color="#b9823f"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100" height="100" rx="22" fill="#8a0f0f"/>
          <path d="M25,46 C25,28 33,16 50,10 C67,16 75,28 75,46" fill="none" stroke="url(#goldGradNav)" stroke-width="4.2" stroke-linecap="round"/>
          <g fill="url(#goldGradNav)">
            <rect x="47.3" y="20" width="5.4" height="11" rx="1.2"/>
            <rect x="43" y="24.3" width="14" height="4" rx="1.2"/>
            <ellipse cx="50" cy="38" rx="9.5" ry="8"/>
            <rect x="45.5" y="44" width="9" height="7" rx="1.5"/>
            <path d="M38,73 C38,60 42,53 50,51 C58,53 62,60 62,73 Z"/>
            <rect x="34" y="73" width="32" height="7" rx="2"/>
            <rect x="31" y="80" width="38" height="6" rx="2"/>
          </g>
        </svg>
      </span>
      <span class="brand-text">پنل مدیر مدرسه</span>
    </div>

    <nav id="side-nav">
      <button class="nav-item active" data-view="home"><span class="nav-ic">🏠</span><span>خانه</span></button>
      <button class="nav-item" data-view="classes"><span class="nav-ic">🏫</span><span>کلاس‌ها</span></button>
      <button class="nav-item" data-view="players"><span class="nav-ic">♟️</span><span>بازیکن‌ها</span></button>
      <button class="nav-item" data-view="matches"><span class="nav-ic">📅</span><span>مسابقات</span></button>
      <button class="nav-item" data-view="top"><span class="nav-ic">🏆</span><span>نفرات برتر</span></button>
      <button class="nav-item" data-view="trends"><span class="nav-ic">📈</span><span>روندها</span></button>
    </nav>

    <div class="sidebar-foot">
      <span class="live-dot"></span>
      <span>نمای فقط‌خواندنی — بدون امکان ویرایش</span>
    </div>
  </aside>

  <!-- ── محتوای اصلی ───────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <h2 id="view-title">خانه</h2>
      <div id="topbar-clock" class="topbar-clock">--:--:--</div>
    </header>

    <div id="view-body" class="view-body">
      <div class="loading-state"><span class="spinner"></span>در حال بارگذاری…</div>
    </div>
  </main>

  <!-- ── ناوبری پایین صفحه (فقط موبایل) ───────────────────── -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="bn-item active" data-view="home"><span class="bn-ic">🏠</span><span class="bn-label">خانه</span></button>
    <button class="bn-item" data-view="classes"><span class="bn-ic">🏫</span><span class="bn-label">کلاس‌ها</span></button>
    <button class="bn-item" data-view="players"><span class="bn-ic">♟️</span><span class="bn-label">بازیکن‌ها</span></button>
    <button class="bn-item" data-view="matches"><span class="bn-ic">📅</span><span class="bn-label">مسابقات</span></button>
    <button class="bn-item" data-view="top"><span class="bn-ic">🏆</span><span class="bn-label">برترین‌ها</span></button>
    <button class="bn-item" data-view="trends"><span class="bn-ic">📈</span><span class="bn-label">روندها</span></button>
  </nav>

</div>

<script>window.PRINCIPAL_KEY = "{{KEY}}";</script>
<script src="/principal-assets/app.js?v={{V}}"></script>
</body>
</html>
